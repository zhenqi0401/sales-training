# 销售培训系统 — Nginx 生产配置
#
# 域名 / 公网 IP 访问统一入口：
#   /              → training-web（培训端，移动优先）
#   /admin         → admin-web（管理端）
#   /api/*         → FastAPI 后端（反向代理）
#   /uploads/*     → Nginx 直接返回（高性能静态文件）
#
# 部署前请将 server_name 替换为实际公网 IP 或域名。

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 接受任意域名/IP 访问；如有域名，替换此行

    # 上传文件大小限制（视频可能较大）
    client_max_body_size 500M;

    # ================================================================
    # 管理端（Vue SPA）
    # ================================================================
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
    }

    # ================================================================
    # 培训端（默认入口）
    # ================================================================
    location / {
        root /usr/share/nginx/html/training;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ================================================================
    # API 反向代理 → FastAPI
    # ================================================================
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应需要关掉缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ================================================================
    # 上传文件（视频、封面）
    # ================================================================
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";

        types {
            video/mp4 mp4;
            video/quicktime mov;
            video/x-msvideo avi;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
    }
}
