# ============================================================================
# 销售培训系统 — Nginx 站点配置（docker-compose 的 training-nginx 容器使用）
# 由 docker-compose.yml 挂载到 /etc/nginx/conf.d/default.conf
#
# 部署同事按需修改：
#   1) server_name 改成实际域名
#   2) 需要 HTTPS 时，见文件末尾「443/SSL 模板」注释段
# ============================================================================

server {
    listen 80;
    server_name _;            # ← 替换为实际域名，如 training.example.com

    # 分片上传单个分片 + 封面上传需要较大请求体；视频本体走 OSS 不经此处
    client_max_body_size 200m;

    # ---- 培训端（移动端，根路径）training-web ----
    location / {
        root /usr/share/nginx/html/training;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- 管理端 admin-web（/admin/ 子路径，构建时 base=/admin/）----
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- 后端 API 反向代理（前端 baseURL = /api/v1）----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;     # 上传 merge / 发布触发等接口可能较久
        proxy_send_timeout 600s;
    }

    # ---- 健康检查 ----
    location /health {
        proxy_pass http://backend:8080/health;
    }

    # ---- 历史本地视频/封面（OSS 上线前上传的文件）----
    # 新视频走 OSS 私有桶 + 签名 URL 直链，不经过 Nginx；此处仅兼容旧数据。
    # 若已把历史视频全部迁移到 OSS，可整段删除。
    location /uploads/ {
        alias /data/uploads/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
    }
}

