name: sales-training

services:
  mysql:
    image: mysql:8.0
    container_name: training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: sales_training
      MYSQL_USER: training
      MYSQL_PASSWORD: training123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: training-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SALES_TRAINING_DATABASE_URL: mysql+asyncmy://training:training123@mysql:3306/sales_training
      SALES_TRAINING_CELERY_BROKER_URL: redis://redis:6379/0
      SALES_TRAINING_CELERY_RESULT_BACKEND: redis://redis:6379/0
      SALES_TRAINING_JWT_SECRET_KEY: change-this-to-a-secure-random-key-in-production
      SALES_TRAINING_JWT_ALGORITHM: HS256
      SALES_TRAINING_JWT_EXPIRE_MINUTES: 120
      SALES_TRAINING_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  mysql_data:
  redis_data:
  uploads_data:
