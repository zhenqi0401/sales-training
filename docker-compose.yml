name: sales-training

services:
  # ====================================================================
  # MySQL 8.0 — 数据库
  # ====================================================================
  mysql:
    image: mysql:8.0
    container_name: training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: sales_training
      MYSQL_USER: ${MYSQL_USER:-training}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-training123}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # Redis 7 — 缓存 + Celery 消息队列
  # ====================================================================
  redis:
    image: redis:7-alpine
    container_name: training-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================================================
  # FastAPI 后端
  # ====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SALES_TRAINING_DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-training}:${MYSQL_PASSWORD:-training123}@mysql:3306/sales_training
      SALES_TRAINING_CELERY_BROKER_URL: redis://redis:6379/0
      SALES_TRAINING_CELERY_RESULT_BACKEND: redis://redis:6379/0
      TZ: Asia/Shanghai
    # ports:                    # 仅 Nginx 通过 Docker 网络访问
    #   - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080

  # ====================================================================
  # Celery Worker — AI 出题异步任务
  # ====================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-celery
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SALES_TRAINING_DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-training}:${MYSQL_PASSWORD:-training123}@mysql:3306/sales_training
      SALES_TRAINING_CELERY_BROKER_URL: redis://redis:6379/0
      SALES_TRAINING_CELERY_RESULT_BACKEND: redis://redis:6379/0
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  # ====================================================================
  # Nginx — 统一入口 + 静态文件 + 反向代理
  # ====================================================================
  nginx:
    image: nginx:alpine
    container_name: training-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web/dist:/usr/share/nginx/html/admin:ro
      - ./training-web/dist:/usr/share/nginx/html/training:ro
      - uploads_data:/data/uploads:ro

volumes:
  mysql_data:
  redis_data:
  uploads_data:
