# Example Nginx static media mapping for FR-A05.
#
# Keep this alias aligned with SALES_TRAINING_UPLOAD_DIR. The application
# returns URLs under /uploads/videos/ and /uploads/covers/.

location /uploads/ {
    alias /data/videos/;
    autoindex off;
    add_header Cache-Control "public, max-age=86400";

    types {
        video/mp4 mp4;
        video/quicktime mov;
        video/x-msvideo avi;
        image/jpeg jpg jpeg;
        image/png png;
        image/webp webp;
    }
}
